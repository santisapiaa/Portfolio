<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Santiago Sapia</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .not-found {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 18px;
  }
  .not-found .code {
    font-family: var(--font-mono);
    font-size: clamp(4rem, 18vw, 8rem);
    font-weight: 600;
    line-height: 1;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .not-found h1 { font-size: clamp(1.4rem, 4vw, 2rem); }
  .not-found p { color: var(--text-dim); max-width: 42ch; }
  .not-found .btn { margin-top: 12px; }
</style>
</head>
<body>
<div class="noise"></div>
<main class="not-found">
  <a href="/" class="logo">SS<span class="dot">.</span></a>
  <p class="code">404</p>
  <h1 id="nf-title">Esta página no existe</h1>
  <p id="nf-desc">Puede que el link esté mal escrito o que la página se haya movido.</p>
  <a href="/" class="btn btn-primary" id="nf-btn">Volver al inicio</a>
</main>
<script>
  // Match the language the visitor picked on the portfolio
  const texts = {
    en: ['Page not found', "This page doesn't exist", 'The link may be mistyped or the page may have moved.', 'Back to home', 'en'],
    pt: ['Página não encontrada', 'Esta página não existe', 'O link pode estar errado ou a página pode ter sido movida.', 'Voltar ao início', 'pt-BR']
  };
  let lang = null;
  try { lang = localStorage.getItem('lang'); } catch {}
  if (!lang) lang = (navigator.language || 'es').slice(0, 2);
  const t = texts[lang];
  if (t) {
    document.title = t[0] + ' — Santiago Sapia';
    document.getElementById('nf-title').textContent = t[1];
    document.getElementById('nf-desc').textContent = t[2];
    document.getElementById('nf-btn').textContent = t[3];
    document.documentElement.lang = t[4];
  }
</script>
</body>
</html>
